              "05c414993d1cd9e7182bbf5647be1ffad72c6ed6b6f5399d01af27281fef48b8")
          phoff = struct.unpack_from("<Q", source, 32)[0]
          phentsize, phnum = struct.unpack_from("<HH", source, 54)
          if phentsize != 56 or phnum > 64 or phoff + 56 * phnum > len(source):
              raise SystemExit("unexpected pinned program header table")
          loads = []
          for i in range(phnum):
              kind, flags, off, va, _, filesz, _, _ = struct.unpack_from(
                  "<IIQQQQQQ", source, phoff + 56 * i)
              if kind == 1 and flags & 1:
