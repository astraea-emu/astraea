name: C1 public game-like ELF closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Changing live Breakout claims must re-run source-pinned closure.
      - 'README.md'
      - 'docs/STATUS.md'
      - '.github/workflows/c1-public-demo-closure.yml'
      - 'src/app/**'
      - 'tools/reference/public_breakout_import_audit.py'
      - 'tools/reference/ps5_process_entry_observer/owned_ptrace_step_research.cpp'
      - 'src/loader/**'
      - 'include/astraea/loader/**'
      - 'src/execution/linux_retail_diagnostic.cpp'
      - 'tools/reference/ps5_process_entry_observer/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  public-demo-closure:
    name: Public Breakout ELF static closure
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Astraea
        uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Build production Astraea read-only diagnostics
        run: |
          cmake -S . -B "$RUNNER_TEMP/astraea-public-demo-profile" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DASTRAEA_WARNINGS_AS_ERRORS=ON \
            -DASTRAEA_BUILD_C1_RESEARCH=ON
          cmake --build "$RUNNER_TEMP/astraea-public-demo-profile" \
            --target astraea astraea_c1_breakout_memory_plan_research astraea_c1_owned_guest_memory_research astraea_c1_owned_cpu_step_research astraea_c1_owned_effect_ledger_research astraea_c1_unicorn_effect_bridge_research astraea_c1_indirect_call_research --parallel 3

      - name: Exercise owned virtual guest memory permissions and failures
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/astraea-public-demo-profile/astraea_c1_owned_guest_memory_research"
          "$probe" | tee "$RUNNER_TEMP/astraea-owned-guest-memory.txt"
          for expected in \
            "C1 OWNED VIRTUAL GUEST MEMORY PASS" \
            "checked_regions=8" \
            "checked_guest_rw_stack=pass" \
            "preflight_write=nonmutating_checked_full_range" \
            "write_readonly=refused" \
            "execute_nonexec=refused" \
            "read_no_read_permission=refused" \
            "cross_region_write=refused_without_partial_mutation" \
            "overlapping_caller_spans=memmove_safe" \
            "overflow_unmapped_empty=refused" \
            "overlap_host_alias=refused" \
            "guest_virtual_wx=represented_without_host_executable_mapping" \
            "native_hostile_code_containment=not_established"; do
            grep -Fx "$expected" "$RUNNER_TEMP/astraea-owned-guest-memory.txt"
          done
          echo "SOURCE-OWNED VIRTUAL MEMORY CONFORMANCE; NO GUEST NATIVE ENTRY"

      - name: Test reusable CPU step and typed pre-retirement refusals
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/astraea-public-demo-profile/astraea_c1_owned_cpu_step_research"
          "$probe" | tee "$RUNNER_TEMP/astraea-owned-cpu-step.txt"
          for expected in \
            "C1 OWNED CPU STEP PASS" \
            "owned_push_mov_sub_store=retired" \
            "owned_step_guest_writes=checked" \
            "control_transfer_stop=before_retirement" \
            "failed_guest_write=cpu_and_bytes_unchanged" \
            "guest_register_flags=sub_zero_case_verified" \
            "malformed_record_and_unknown_opcode=refused" \
            "owned_direct_entry_and_call=checked_two_instructions" \
            "direct_call_target_and_stack_denials=pre_retirement" \
            "owned_guest_fetch_step=bounded_and_typed" \
            "owned_cpu_backend_reference_trace=exact_commits_and_writes" \
            "owned_cpu_backend_stopped_call=no_trace_event" \
            "owned_cpu_backend_short_trace=refused_without_mutation" \
            "owned_fetch_uses_execute_permission=verified" \
            "source_mutation_and_partial_faults=refused" \
            "failed_later_instruction=prior_retirements_only" \
            "breakout_elf_execution=not_part_of_this_test" \
            "native_hostile_code_containment=not_established"; do
            grep -Fx "$expected" "$RUNNER_TEMP/astraea-owned-cpu-step.txt"
          done

      - name: Verify backend-neutral committed effect and partial-fault ledger
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/astraea-public-demo-profile/astraea_c1_owned_effect_ledger_research"
          "$probe" | tee "$RUNNER_TEMP/astraea-owned-effect-ledger.txt"
          for expected in \
            "C1 OWNED EFFECT LEDGER PASS" \
            "owned_interpreter_store=readback_verified" \
            "owned_interpreter_preflight_refusal=no_effects" \
            "variable_width_and_multiple_writes=recorded" \
            "partial_fault=prefix_preserved_restart_state" \
            "hook_value_alone=not_commit_evidence" \
            "overflow_and_unreadable=fail_closed" \
            "backend_adoption=not_authorized" \
            "native_outside_authored_execution=none"; do
            grep -Fx "$expected" "$RUNNER_TEMP/astraea-owned-effect-ledger.txt"
          done

      - name: Test typed checked indirect CALL observation without retirement
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/astraea-public-demo-profile/astraea_c1_indirect_call_research"
          "$probe" | tee "$RUNNER_TEMP/astraea-indirect-call.txt"
          for expected in \
            "C1 INDIRECT CALL OBSERVATION PASS" \
            "rip_relative_got_word=read_via_guest_virtual_memory" \
            "call_control_transfer=not_retired" \
            "source_byte_and_context_mismatch=refused" \
            "nonexec_and_unreadable_got=refused" \
            "missing_and_truncated_got=refused" \
            "cpu_and_guest_bytes=unchanged" \
            "sony_provider_resolution=not_attempted" \
            "native_guest_execution=none"; do
            grep -Fx "$expected" "$RUNNER_TEMP/astraea-indirect-call.txt"
          done

      - name: Fetch and verify pinned independent Breakout demo
        env:
          DEMO_URL: https://github.com/sharpemu/sharpemu-demo/releases/download/49e6b3b/sharpemu-demo.zip
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "$DEMO_URL" --output "$RUNNER_TEMP/sharpemu-demo.zip"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import struct
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"])
          archive = root / "sharpemu-demo.zip"
          pinned_zip_sha256 = "2413f587b6f310c7b0f5ae3f76019de53d5a419141e7392b48096648eb74def4"
          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != pinned_zip_sha256:
              raise SystemExit(f"upstream release archive drift: sha256={actual_sha}")
          with zipfile.ZipFile(archive) as zf:
              binaries = [name for name in zf.namelist()
                          if name == "eboot.bin" or name.endswith("/eboot.bin")]
              if len(binaries) != 1:
                  raise SystemExit(f"expected one eboot.bin, found {len(binaries)}")
              executable = zf.read(binaries[0])
          if len(executable) < 64 or executable[:7] != b"\x7fELF\x02\x01\x01":
              raise SystemExit("upstream game executable is not ELF64 little-endian")
          if executable[7] != 9 or executable[8] != 2:
              raise SystemExit("upstream game ELF OSABI unexpectedly changed")
          elf_type, machine = struct.unpack_from("<HH", executable, 16)
          if machine != 62 or elf_type not in (2, 3, 0xfe10, 0xfe18):
              raise SystemExit("unexpected ELF machine or type")
          dest = root / "sharpemu-demo-eboot.elf"
          dest.write_bytes(executable)
          if hashlib.sha256(executable).hexdigest() != (
              "05c414993d1cd9e7182bbf5647be1ffad72c6ed6b6f5399d01af27281fef48b8"
          ):
              raise SystemExit("source-pinned Breakout identity changed")
          entry, phoff = struct.unpack_from("<QQ", executable, 24)
          phentsize, phcount = struct.unpack_from("<HH", executable, 54)
          matches = []
          for i in range(phcount):
              kind, flags, offset, vaddr, _paddr, filesz, _memsz, _align = (
                  struct.unpack_from("<IIQQQQQQ",
                                     executable, phoff + i * phentsize))
              if kind != 1 or not (flags & 1) or entry < vaddr:
                  continue
              delta = entry - vaddr
              if delta + 16 <= filesz and offset + delta + 16 <= len(executable):
                  matches.append(executable[offset + delta:offset + delta + 16])
          if len(matches) != 1:
              raise SystemExit("entry source bytes not uniquely executable")
          print("source_pinned_entry_rip=0x%x" % entry)
          print("source_pinned_entry_first_16_hex=" + matches[0].hex())
          print("PUBLIC DEMO PIN PASS")
          print("upstream_source=sharpemu/sharpemu-demo@49e6b3b25678f14ec57a70b907ee215fddb608d8")
          print("upstream_code_license=GPL-2.0-or-later (per source README)")
          print("archive_sha256=" + actual_sha)
          print("elf_sha256=" + hashlib.sha256(executable).hexdigest())
          print(f"elf_type={elf_type} elf_size={len(executable)}")
          print("external_assets=not_extracted")
          print("guest_execution=not_attempted")
          PY

      - name: Record the first exact Astraea static boundary
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          executable = root / "astraea-public-demo-profile/astraea"
          guest = root / "sharpemu-demo-eboot.elf"
          if not executable.is_file() or not guest.is_file():
              raise SystemExit("required executable missing")
          for mode in ("profile", "dependencies", "diagnose"):
              result = subprocess.run([str(executable), mode, str(guest)],
                                      capture_output=True, text=True, timeout=30,
                                      check=False)
              if result.returncode < 0:
                  raise SystemExit(f"{mode} terminated by signal {-result.returncode}")
              if result.returncode > 10:
                  raise SystemExit(f"{mode} unexpected return code {result.returncode}")
              stdout, stderr = result.stdout, result.stderr
              if len(stdout) > 250000 or len(stderr) > 250000:
                  raise SystemExit(f"{mode} emitted unbounded output")
              if result.returncode == 0 and not stdout.strip():
                  raise SystemExit(f"{mode} returned success with no evidence")
              if result.returncode != 0 and not stderr.strip():
                  raise SystemExit(f"{mode} rejected without an explanation")
              print(f"ASTRAEA_{mode.upper()}_RC={result.returncode}")
              print(f"ASTRAEA_{mode.upper()}_STDOUT_BEGIN")
              print(stdout[:11000].rstrip())
              print(f"ASTRAEA_{mode.upper()}_STDOUT_END")
              print(f"ASTRAEA_{mode.upper()}_STDERR_BEGIN")
              print(stderr[:3000].rstrip())
              print(f"ASTRAEA_{mode.upper()}_STDERR_END")
              if mode == "diagnose":
                  if result.returncode != 0:
                      raise SystemExit("pinned production diagnostic unexpectedly errored")
                  fields = dict(
                      line.split("=", 1) for line in stdout.splitlines()
                      if "=" in line
                  )
                  if any(fields.get(key) != value for key, value in {
                      "boundary": "loader_rejected",
                      "stage": "pre_entry",
                      "guest_rip": "0x0",
                  }.items()):
                      raise SystemExit(
                          "production diagnose admission drift on pinned raw ELF"
                      )
          for mode in ("profile", "dependencies"):
              result = subprocess.run(
                  [str(executable), mode, "--ps5-raw-elf", str(guest)],
                  capture_output=True, text=True, timeout=30, check=False)
              if result.returncode < 0 or result.returncode > 10:
                  raise SystemExit(f"raw {mode} unexpectedly failed: {result.returncode}")
              if result.returncode == 0 and not result.stdout.strip():
                  raise SystemExit(f"raw {mode} returned empty success")
              if result.returncode != 0 and not result.stderr.strip():
                  raise SystemExit(f"raw {mode} refused without diagnostics")
              if mode == "profile" and "dynamic_symbol_error=4" in result.stderr:
                  raise SystemExit(
                      "GNU hash symbol-count evidence did not retire the exact prior blocker")
              if result.returncode != 0:
                  raise SystemExit(f"pinned raw {mode} now rejected: {result.stderr[:400]}")
              if mode == "profile":
                  report = dict(line.split("=", 1)
                                for line in result.stdout.splitlines()
                                if "=" in line)
                  expected = {
                      "program_headers": "4",
                      "load_segments": "3",
                      "generic_needed": "5",
                      "dynamic_symbols": "20",
                      "rel_relocations": "0",
                      "rela_relocations": "20",
                      "plt_relocations": "0",
                      "total_relocations": "20",
                      "tls_present": "0",
                  }
                  if any(report.get(key) != value for key, value in expected.items()):
                      raise SystemExit(f"pinned raw ELF profile drift: {report}")
              else:
                  report = dict(line.split("=", 1)
                                for line in result.stdout.splitlines()
                                if "=" in line)
                  for key, value in {
                      "generic_needed_records": "5",
                      "dynamic_symbol_records": "20",
                      "relocation_records": "20",
                      "guest_instructions": "0",
                      "relocation_application": "not_attempted",
                      "resolution": "not_attempted",
                  }.items():
                      if report.get(key) != value:
                          raise SystemExit(f"pinned dependency drift: {key}={report.get(key)}")
                  relocation_types = [
                      int(value) for value in
                      re.findall(r"^relocation\[\d+\]\.type=(\d+)$",
                                 result.stdout, re.MULTILINE)]
                  if sorted(relocation_types) != [6] * 19 + [8]:
                      raise SystemExit(f"unsupported pinned relocation census: {relocation_types}")
              print(f"ASTRAEA_RAW_{mode.upper()}_RC={result.returncode}")
              print(f"ASTRAEA_RAW_{mode.upper()}_STDOUT_BEGIN")
              print(result.stdout[:12000].rstrip())
              print(f"ASTRAEA_RAW_{mode.upper()}_STDOUT_END")
              print(f"ASTRAEA_RAW_{mode.upper()}_STDERR_BEGIN")
              print(result.stderr[:4000].rstrip())
              print(f"ASTRAEA_RAW_{mode.upper()}_STDERR_END")
          print("PUBLIC GAME-LIKE ELF READ-ONLY FIRST-BOUNDARY RECORD COMPLETE")
          print("retail_first_instruction=not_attempted")
          print("gameplay=not_claimed")
          PY

      - name: Verify the exact author's NID-to-library import declaration against ELF
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/sharpemu/sharpemu-demo/49e6b3b25678f14ec57a70b907ee215fddb608d8/build.py" \
            --output "$RUNNER_TEMP/independent-breakout-build.py"
          "$RUNNER_TEMP/astraea-public-demo-profile/astraea" \
            dependencies --ps5-raw-elf \
            "$RUNNER_TEMP/sharpemu-demo-eboot.elf" \
            > "$RUNNER_TEMP/independent-breakout-manifest.txt"
          python3 tools/reference/public_breakout_import_audit.py \
            --author-source "$RUNNER_TEMP/independent-breakout-build.py" \
            --manifest "$RUNNER_TEMP/independent-breakout-manifest.txt" \
            --elf "$RUNNER_TEMP/sharpemu-demo-eboot.elf" \
            | tee "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "source_to_elf_nid_matches=19" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "sony_export_resolution=not_attempted" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "mapped_writable_glob_dat_targets=19" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "mapped_writable_relative_targets=1" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "relocation_target_overlap=none" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "relocation_executable_targets=none" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "writable_executable_load_segments=1" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          grep -Fx "native_guest_entry=blocked_by_source_rwx_load" \
            "$RUNNER_TEMP/independent-breakout-import-identity.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          root = Path(os.environ["RUNNER_TEMP"])
          original_source = root / "independent-breakout-build.py"
          original_manifest = root / "independent-breakout-manifest.txt"
          original_elf = root / "sharpemu-demo-eboot.elf"
          tool = Path("tools/reference/public_breakout_import_audit.py")
          manifest = original_manifest.read_text(encoding="utf-8")

          # A bounded mutation corpus: every mismatch must be rejected.
          changes = {
              "unknown_nid": (r"(?m)^symbol\[1\]\.name_hex=[0-9a-f]*$",
                              "symbol[1].name_hex=" + "61" * 11),
              "wrong_library": (r"(?m)^generic_needed\[0\]\.name_hex=[0-9a-f]*$",
                                "generic_needed[0].name_hex=" + "61" * 11),
              "incorrect_relocation": (r"(?m)^relocation\[1\]\.type=6$",
                                       "relocation[1].type=8"),
              "duplicated_symbol": (r"(?m)^symbol\[1\]\.name_hex=[0-9a-f]*$",
                                    "symbol[1].name_hex=" + "61" * 11 +
                                    "\nsymbol[1].name_hex=" + "61" * 11),
              "unmapped_target": (r"(?m)^relocation\[1\]\.target=0x[0-9a-f]+$",
                                  "relocation[1].target=0xffffffffffffffff"),
          }
          # Force one eight-byte write to overlap a different import's
          # target without altering symbol/NID identity. The pinned
          # audit must refuse before any relocation application.
          target2 = re.search(
              r"(?m)^relocation\[2\]\.target=(0x[0-9a-f]+)$", manifest)
          if target2 is None:
              raise SystemExit("second original relocation target absent")
          changes["overlapping_target"] = (
              r"(?m)^relocation\[1\]\.target=0x[0-9a-f]+$",
              "relocation[1].target=" + target2.group(1),
          )
          for name, (pattern, replacement) in changes.items():
              mutated, count = re.subn(pattern, replacement, manifest)
              if count != 1:
                  raise SystemExit(f"test fixture selection failed: {name}")
              path = root / f"negative-breakout-{name}.txt"
              path.write_text(mutated, encoding="utf-8")
              run = subprocess.run(
                  [sys.executable, str(tool), "--author-source",
                   str(original_source), "--manifest", str(path),
                   "--elf", str(original_elf)],
                  capture_output=True, text=True, timeout=15, check=False)
              if run.returncode != 2 or "AUDIT REFUSED" not in run.stderr:
                  raise SystemExit(f"invalid import corpus accepted: {name}")

          altered_source = root / "negative-breakout-source.py"
          altered_source.write_bytes(
              original_source.read_bytes() + b"\n# intentional source drift\n")
          run = subprocess.run(
              [sys.executable, str(tool), "--author-source",
               str(altered_source), "--manifest", str(original_manifest),
               "--elf", str(original_elf)],
              capture_output=True, text=True, timeout=15, check=False)
          if run.returncode != 2 or "author_source_blob_identity_drift" not in run.stderr:
              raise SystemExit("unverified upstream author source accepted")

          # Source verification must bind to the *actual* immutable ELF
          # bytes, not solely an arbitrary copy of the CLI manifest.
          altered_elf = root / "negative-breakout-drifted.elf"
          payload = bytearray(original_elf.read_bytes())
          payload[0] ^= 1
          altered_elf.write_bytes(payload)
          run = subprocess.run(
              [sys.executable, str(tool), "--author-source",
               str(original_source), "--manifest", str(original_manifest),
               "--elf", str(altered_elf)],
              capture_output=True, text=True, timeout=15, check=False)
          if run.returncode != 2 or "pinned_elf_identity_drift" not in run.stderr:
              raise SystemExit("drifted external ELF source admitted")

          # The exact pinned ELF's sole executable segment is RWX,
          # independently establishing a *native admission blocker*.
          # A relocation write into an executable load is still refused,
          # even when that load is source-marked writable. Never drop W^X
          # to make this external fixture executable.
          import struct
          original = original_elf.read_bytes()
          phoff = struct.unpack_from("<Q", original, 32)[0]
          entsize, phnum = struct.unpack_from("<HH", original, 54)
          executable_loads = []
          for i in range(phnum):
              typ, flags, _off, va, _pa, _fsize, memsz, _align = (
                  struct.unpack_from("<IIQQQQQQ", original, phoff + i * entsize))
              if typ == 1 and (flags & 1) and memsz >= 8:
                  executable_loads.append(va)
          if len(executable_loads) != 1:
              raise SystemExit("pinned executable load count drift")
          modified_manifest, count = re.subn(
              r"(?m)^relocation\[1\]\.target=0x[0-9a-f]+$",
              "relocation[1].target=" + hex(executable_loads[0]), manifest)
          if count != 1:
              raise SystemExit("cannot mutate relocation to executable target")
          negative_path = root / "negative-breakout-executable-target.txt"
          negative_path.write_text(modified_manifest, encoding="utf-8")
          run = subprocess.run(
              [sys.executable, str(tool), "--author-source",
               str(original_source), "--manifest", str(negative_path),
               "--elf", str(original_elf)],
              capture_output=True, text=True, timeout=15, check=False)
          if run.returncode != 2 or "relocation_target_executable" not in run.stderr:
              raise SystemExit("executable guest relocation target admitted")
          print("BREAKOUT IMPORT NEGATIVE AUDIT PASS")
          print("guest_execution=none")
          PY

      - name: Assess exact Breakout GuestImage memory plan without guest entry
        run: |
          set -euo pipefail
          preflight="$RUNNER_TEMP/astraea-public-demo-profile/astraea_c1_breakout_memory_plan_research"
          elf="$RUNNER_TEMP/sharpemu-demo-eboot.elf"
          "$preflight" "$elf" | tee "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "PINNED BREAKOUT ACTUAL MEMORY PLAN PREFLIGHT PASS" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "source_plan=mixed_write_execute_page" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "research_narrowed_plan=blocked_mixed_write_execute_page" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "research_narrowed_host_page_conflict=rx_rw_distinct_loads" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "guestimage_load_segments=3" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "source_rwx_executable_loads=1" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ["RUNNER_TEMP"]) /
                   "actual-breakout-plan.txt").read_text().splitlines()
          fields = dict(line.split("=", 1) for line in lines if "=" in line)
          fragments = int(fields["source_rwx_mapping_fragments"])
          narrowed = int(fields["research_narrowed_mapping_count"])
          if fragments < 1 or fragments != narrowed:
              raise SystemExit("RWX mapping fragments were not all narrowed")
          page = int(fields["research_narrowed_mixed_page"], 16)
          if page % 4096 or page < 0:
              raise SystemExit("reported mixed host page is not aligned")
          if (int(fields["research_rx_source_ph_index"]) ==
                  int(fields["research_rw_source_ph_index"])):
              raise SystemExit("mixed host page not from distinct PT_LOAD sources")
          print("ACTUAL BREAKOUT SOURCE-MAPPING POLICY ASSERTIONS PASS")
          PY
          grep -Fx "original_guest_permissions=unchanged" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "temporary_guest_va_prepared_and_released=1" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "temporary_guest_source_fragments=4" \
            "$RUNNER_TEMP/actual-breakout-plan.txt"
          grep -Fx "temporary_guest_page_compared_bytes=4096" \
