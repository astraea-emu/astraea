              bhex = fields[key + ".bytes_hex"]
              mnemonic = fields[key + ".mnemonic"]
              if (rip != current or not 1 <= length <= 15 or
                      not re.fullmatch(r"[0-9a-f]+", bhex) or
                      len(bytes.fromhex(bhex)) != length or
                      not re.fullmatch(r"[A-Za-z0-9_]+", mnemonic)):
                  raise SystemExit(f"invalid decoded instruction {i}")
              origins = [(off + rip - lo) for lo, hi, off in loads
                         if lo <= rip and rip + length <= hi]
              if len(origins) != 1 or (
                  source[origins[0]:origins[0]+length] != bytes.fromhex(bhex)):
                  raise SystemExit(f"decoded bytes differ from source ELF at {rip:#x}")
              print(f"PINNED_BREAKOUT_CALLEE_{i}={rip:#x}:{mnemonic}:{bhex}")
              current += length
          if current != int(fields["source_x86_callee_decode_next_rip"], 16):
              raise SystemExit("decoder's next RIP does not match boundaries")
