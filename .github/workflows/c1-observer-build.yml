name: C1 pinned observer build proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/c1-observer-build.yml'
      - 'tools/reference/ps5_process_entry_observer/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'include/astraea/loader/**'
      - 'include/astraea/memory/**'
      - 'include/astraea/execution/**'
      - 'src/app/**'
      - 'src/loader/**'
      - 'src/memory/**'
      - 'src/execution/**'
      - 'tests/loader/**'
      - 'tests/execution/**'

permissions:
  contents: read

jobs:
  pinned-native-title-build:
    name: Pinned observer host build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Astraea
        uses: actions/checkout@v7

      - name: Install public host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-18 lld-18 make ninja-build ccache pkg-config python3 \
            python3-venv curl wget unzip tar git

      - name: Check out the reviewed native-title reference
        env:
          PINNED_BLACKBEAR: 2f672d1c2f508e26f82ce6e27cef289a0861413c
        run: |
          git clone https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git \
            "$RUNNER_TEMP/ps5-native-app-boilerplate"
          git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" \
            checkout --detach "$PINNED_BLACKBEAR"
          test "$(git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" rev-parse HEAD)" = "$PINNED_BLACKBEAR"
          test -z "$(git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" status --porcelain --untracked-files=all)"

      - name: Prepare exact observer without transport or console access
        run: |
          python3 tools/reference/ps5_process_entry_observer/prepare_blackbear_checkout.py \
            --checkout "$RUNNER_TEMP/ps5-native-app-boilerplate"
          test -s "$RUNNER_TEMP/ps5-native-app-boilerplate/.astraea-ps5-entry-observer-v0"

      - name: Build native title using the pinned public toolchain
        run: |
          make --directory="$RUNNER_TEMP/ps5-native-app-boilerplate" \
            USE_CCACHE=0 app

      - name: Verify build outputs and selected entry symbol
        run: |
          python3 - <<'PY'
          import pathlib
          import runpy
          import struct
          import os
          import hashlib

          checkout = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ps5-native-app-boilerplate'
          source = pathlib.Path('tools/reference/ps5_process_entry_observer/procparam_identity.py')
          analyzer = runpy.run_path(str(source))
          intermediate_path = checkout / 'build/llvm-pie.elf'
          final_path = checkout / 'build/eboot.elf'
          binaries = sorted((checkout / 'dist').glob('*/eboot.bin'))
          if len(binaries) != 1:
              raise SystemExit(f'expected exactly one built eboot.bin, found {len(binaries)}')
          artifacts = [intermediate_path, final_path, binaries[0]]
          for path in artifacts:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'build artifact missing or empty: {path}')

          intermediate = intermediate_path.read_bytes()
          final = final_path.read_bytes()
          find_symbol = analyzer['find_defined_symbol']
          observer_entry = find_symbol(intermediate, '_start', 'intermediate ELF')
          crt_entry = find_symbol(intermediate, 'astraea_reference_crt_start', 'intermediate ELF')
          capture = find_symbol(intermediate, 'astraea_ps5_entry_capture_v0', 'intermediate ELF')
          initial_entry = struct.unpack_from('<Q', intermediate, 0x18)[0]
          final_entry = struct.unpack_from('<Q', final, 0x18)[0]
          if observer_entry != initial_entry or observer_entry == crt_entry:
              raise SystemExit('observer is not the selected intermediate ELF entry or aliases CRT')
          if final_entry != observer_entry:
              raise SystemExit('converted PS5 ELF entry does not preserve the observer entry')
          procparam, _ = analyzer['find_procparam'](final, 'final ELF')
          loads = analyzer['mapped_loads'](final, 'final ELF')
          analyzer['require_unique_mapped_address'](loads, final_entry, 'converted observer entry')
          analyzer['require_unique_mapped_address'](loads, capture, 'observer capture')
          analyzer['require_unique_mapped_address'](loads, procparam.vaddr, 'procparam')

          print(f'verified observer entry 0x{observer_entry:x}; CRT 0x{crt_entry:x}; '
                f'capture 0x{capture:x}; procparam 0x{procparam.vaddr:x}')
          for path in artifacts:
              print(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(checkout)}')
          print('HOST BUILD ONLY; no hardware execution or C1 ABI promotion')
          PY

      - name: Exercise real-ELF offline analysis with labelled synthetic logs
        run: |
          python3 tools/reference/ps5_process_entry_observer/offline_pipeline_smoke.py \
            --intermediate "$RUNNER_TEMP/ps5-native-app-boilerplate/build/llvm-pie.elf" \
            --final "$RUNNER_TEMP/ps5-native-app-boilerplate/build/eboot.elf"

      - name: Build Astraea's production read-only diagnostics
        run: |
          cmake -S . -B "$RUNNER_TEMP/astraea-native-title-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DASTRAEA_WARNINGS_AS_ERRORS=ON
          cmake --build "$RUNNER_TEMP/astraea-native-title-smoke" \
            --target astraea --parallel 3

      - name: Probe public independent PS5-format title with Astraea
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import os

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          astr = root / "astraea-native-title-smoke/astraea"
          homebrew = root / "ps5-native-app-boilerplate"
          assert astr.is_file() and astr.stat().st_size > 0
          target = homebrew / "build/eboot.elf"
          assert target.is_file() and target.stat().st_size > 0
          def run_and_report(command):
              result = subprocess.run(
                  [str(astr), command, str(target)],
                  capture_output=True,
                  text=True,
                  timeout=30,
                  check=False,
              )
              print(f"ASTRAEA_{command.upper()}_RC={result.returncode}")
              print(result.stdout[:6000])
              print(result.stderr[:6000])
              if result.returncode != 0:
                  raise SystemExit(f"{command} did not return its typed success report")
              if result.stderr.strip():
                  raise SystemExit(f"{command} unexpectedly emitted stderr")
              fields = {}
              for line in result.stdout.splitlines()[1:]:
                  if "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  if key in fields:
                      raise SystemExit(f"{command} repeated output field {key}")
                  fields[key] = value
              return fields

          profile = run_and_report("profile")
          for key, expected in {
              "program_headers": "14",
              "load_segments": "5",
              "sce_needed_modules": "4",
              "sce_import_libraries": "4",
              "total_relocations": "40",
              "tls_present": "1",
          }.items():
              if profile.get(key) != expected:
                  raise SystemExit(
                      f"pinned public ELF {key}: expected {expected}, "
                      f"observed {profile.get(key)}"
                  )

          diagnosis = run_and_report("diagnose")
          for key, expected in {
              "boundary": "unsupported_dynamic_dependencies",
              "stage": "pre_entry",
              "guest_rip": "0x10",
              "detail0": "12",
          }.items():
              if diagnosis.get(key) != expected:
                  raise SystemExit(
                      f"pinned public ELF {key}: expected {expected}, "
                      f"observed {diagnosis.get(key)}"
                  )
          print("REAL CLEAN-ROOM ELF PROFILE/DIAGNOSTIC REGRESSION PASS.")
          print("NO GUEST INSTRUCTIONS EXECUTED; NO PS5 HARDWARE OBSERVATION.")
          PY

      - name: Exercise bounded read-only dependency manifest on public native title
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          astr = root / "astraea-native-title-smoke/astraea"
          title = root / "ps5-native-app-boilerplate/build/eboot.elf"
          result = subprocess.run(
              [str(astr), "dependencies", str(title)],
              text=True, capture_output=True, timeout=30, check=False,
          )
          print(result.stdout[:8000])
          print(result.stderr[:1000])
          if result.returncode != 0 or result.stderr.strip():
              raise SystemExit("read-only dependency manifest did not succeed")
          if any(ord(c) < 32 and c != "\n" for c in result.stdout):
              raise SystemExit("manifest contains unescaped control characters")
          lines = result.stdout.splitlines()
          if lines[0] != "Astraea dependency manifest v0":
              raise SystemExit("wrong manifest header")
          # Retain the exact ASCII-only read-only output for the
          # subsequent cross-artifact comparison, not guessed bindings.
          (root / "public-title-dependencies.txt").write_text(
              result.stdout, encoding="ascii")
          fields = {}
          for line in lines[1:]:
              if "=" not in line:
                  raise SystemExit(f"unstructured manifest line: {line!r}")
              key, value = line.split("=", 1)
              if key in fields:
                  raise SystemExit(f"duplicate manifest field: {key}")
              fields[key] = value
          expected = {
              "execution": "none",
              "identity_policy": "opaque",
              "generic_needed_records": "4",
              "sce_needed_module_records": "4",
              "sce_import_library_records": "4",
              "resolution": "not_attempted",
              "guest_instructions": "0",
          }
          for key, value in expected.items():
              if fields.get(key) != value:
                  raise SystemExit(f"manifest {key}: {fields.get(key)!r}, expected {value!r}")
          for i in range(4):
              for category in ("sce_needed_module", "sce_import_library"):
                  prefix = f"{category}[{i}]"
                  assert re.fullmatch(r"0x[0-9a-f]+", fields[f"{prefix}.raw_value"])
                  assert fields[f"{prefix}.duplicate_raw"] in ("0", "1")
              prefix = f"generic_needed[{i}]"
              raw_name = fields[f"{prefix}.name_hex"]
              assert re.fullmatch(r"(?:[0-9a-f]{2})+", raw_name)
              assert len(bytes.fromhex(raw_name)) <= 256
              assert fields[f"{prefix}.duplicate"] in ("0", "1")
          for field in ("generic_needed_unique_names", "sce_needed_module_unique_raw",
                        "sce_import_library_unique_raw"):
              value = int(fields[field])
              if not 1 <= value <= 4:
                  raise SystemExit(f"invalid unique count: {field}={value}")
          if fields.get("dynamic_symbol_records") != "26":
              raise SystemExit("public independent title symbol census changed")
          named = 0
          undefined = 0
          longform = 0
          for i in range(26):
              prefix = f"symbol[{i}]"
              raw_name = fields[f"{prefix}.name_hex"]
              if raw_name:
                  if not re.fullmatch(r"(?:[0-9a-f]{2})+", raw_name):
                      raise SystemExit(f"nonhex symbol name: {prefix}")
                  named += 1
              if fields[f"{prefix}.undefined"] == "1":
                  undefined += 1
              elif fields[f"{prefix}.undefined"] != "0":
                  raise SystemExit(f"invalid undefined field: {prefix}")
              if fields[f"{prefix}.sce_longform"] == "1":
                  longform += 1
                  for item in ("nid_hex", "library_id_hex", "module_id_hex"):
                      if not re.fullmatch(
                          r"(?:[0-9a-f]{2})+",
                          fields[f"{prefix}.{item}"],
                      ):
                          raise SystemExit(f"malformed identity bytes: {prefix}/{item}")
              elif fields[f"{prefix}.sce_longform"] != "0":
                  raise SystemExit(f"invalid identity classification: {prefix}")
              for item in ("binding", "type"):
                  if not 0 <= int(fields[f"{prefix}.{item}"]) <= 15:
                      raise SystemExit(f"invalid ELF symbol field: {prefix}/{item}")
          if not (named > 0 and undefined > 0 and longform > 0):
              raise SystemExit("expected public title to exercise named imports and SCE identities")
          if int(fields["dynamic_symbol_unique_nonempty_names"]) > named:
              raise SystemExit("impossible unique symbol count")
          print(f"SYMBOL CENSUS PASS: 26 records, {named} named, "
                f"{undefined} undefined, {longform} long-form SCE identities.")
          if fields.get("relocation_records") != "40":
              raise SystemExit("pinned public ELF relocation count changed")
          symbols = set()
          counts = {}
          for i in range(40):
              prefix = f"relocation[{i}]"
              kind = fields[f"{prefix}.table"]
              if kind not in ("rel", "rela", "plt_rel", "plt_rela"):
                  raise SystemExit(f"invalid relocation kind {kind!r}")
              counts[kind] = counts.get(kind, 0) + 1
              if not re.fullmatch(r"0x[0-9a-f]+", fields[f"{prefix}.target"]):
                  raise SystemExit(f"invalid relocation target for {prefix}")
              if not re.fullmatch(r"0x[0-9a-f]+", fields[f"{prefix}.raw_info"]):
                  raise SystemExit(f"invalid raw relocation info for {prefix}")
              if not 0 <= int(fields[f"{prefix}.type"]) < 2**32:
                  raise SystemExit(f"invalid relocation type for {prefix}")
              si = int(fields[f"{prefix}.symbol_index"])
              if not 0 <= si < 26:
                  raise SystemExit(f"symbol reference out of range for {prefix}")
              symbols.add(si)
              has_addend = fields[f"{prefix}.has_addend"]
              if has_addend != ("1" if kind.endswith("rela") else "0"):
                  raise SystemExit(f"addend marker mismatches record kind {prefix}")
              if has_addend == "1":
                  int(fields[f"{prefix}.addend"])
              else:
                  if f"{prefix}.addend" in fields:
                      raise SystemExit(f"REL record unexpectedly has addend {prefix}")
          if counts != {"rela": 40}:
              raise SystemExit(f"unexpected relocation kinds in pinned title: {counts}")
          if int(fields["relocation_unique_symbol_indices"]) != len(symbols):
              raise SystemExit("unique relocation symbol count inconsistent")
          if fields.get("relocation_application") != "not_attempted":
              raise SystemExit("static manifest claimed relocation application")
          print(f"RELOCATION CENSUS PASS: 40 RELA records; "
                f"{len(symbols)} distinct referenced symbol indices.")
          malformed = root / "astraea-invalid-dependency-input.bin"
          malformed.write_bytes(b"not-an-elf")
          rejected = subprocess.run(
              [str(astr), "dependencies", str(malformed)],
              text=True, capture_output=True, timeout=30, check=False,
          )
          if rejected.returncode == 0 or "manifest_error=guest_image_failure" not in rejected.stderr:
              raise SystemExit("malformed ELF input was not explicitly refused")
          if rejected.stdout:
              raise SystemExit("malformed input emitted a misleading partial manifest")
          print("DEPENDENCY MANIFEST PASS: real clean-room title, lossless escaped names,")
          print("raw SCE identities, bounded counts, and fail-closed malformed input.")
          print("NO ABI PROMOTION; NO GUEST EXECUTION.")
          PY

      - name: Verify opt-in public SCE packed identity profile on pinned title
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          cli = root / "astraea-native-title-smoke/astraea"
          title = root / "ps5-native-app-boilerplate/build/eboot.elf"
          run = subprocess.run(
              [str(cli), "dependencies", "--public-sce-pack-v1", str(title)],
              capture_output=True, text=True, timeout=30, check=False,
          )
          print(run.stdout[:10000])
          print(run.stderr[:1000])
          if run.returncode != 0 or run.stderr.strip():
              raise SystemExit("opt-in public SCE field profile failed")
          fields = {}
          for line in run.stdout.splitlines()[1:]:
              if "=" not in line:
                  raise SystemExit(f"unexpected public field line {line!r}")
              key, value = line.split("=", 1)
              if key in fields:
                  raise SystemExit(f"duplicate public field {key}")
              fields[key] = value
          for key, expected in {
              "experimental_public_sce_pack_v1": "1",
              "generic_needed_records": "4",
              "sce_needed_module_records": "4",
              "sce_import_library_records": "4",
              "public_sce_module_unique_local_ids": "4",
              "public_sce_library_unique_local_ids": "4",
              "resolution": "not_attempted",
              "relocation_application": "not_attempted",
              "guest_instructions": "0",
          }.items():
              if fields.get(key) != expected:
                  raise SystemExit(f"{key}: {fields.get(key)!r}, expected {expected!r}")
          exact_published_names = (
              "libSceLibcInternal", "libSceSystemService",
              "libSceVideoOut", "libkernel",
          )
          for i in range(4):
              for category, expected_id in (
                  ("sce_needed_module", i + 1),
                  ("sce_import_library", i),
              ):
                  prefix = f"{category}[{i}]"
                  if int(fields[f"{prefix}.public_local_id"]) != expected_id:
                      raise SystemExit(f"unexpected public local ID for {prefix}")
                  if int(fields[f"{prefix}.public_version"]) != 1:
                      raise SystemExit(f"unexpected public version for {prefix}")
                  if int(fields[f"{prefix}.public_name_offset"]) <= 0:
                      raise SystemExit(f"missing published-name offset for {prefix}")
                  name_hex = fields[f"{prefix}.public_name_hex"]
                  if not re.fullmatch(r"(?:[0-9a-f]{2})+", name_hex):
                      raise SystemExit(f"invalid published name for {prefix}")
                  if not 1 <= len(bytes.fromhex(name_hex)) <= 256:
                      raise SystemExit(f"published-name length violates bounds {prefix}")
                  if bytes.fromhex(name_hex) != exact_published_names[i].encode("ascii"):
                      raise SystemExit(f"pinned public ELF published-name bytes changed: {prefix}")

          # Independent public linker source spells import IDs as
          # NID#encoded-local-library-ID#encoded-local-module-ID.
          # Verify this exact pinned title, NOT every retail PS5 title.
          long_form_count = 0
          for i in range(26):
              prefix = f"symbol[{i}]"
              if fields[f"{prefix}.sce_longform"] != "1":
                  if any(key.startswith(f"{prefix}.public_") for key in fields):
                      raise SystemExit(f"unclassified symbol gained a public binding: {prefix}")
                  continue
              long_form_count += 1
              module_id = int(fields[f"{prefix}.public_module_local_id"])
              library_id = int(fields[f"{prefix}.public_library_local_id"])
              if not 1 <= module_id <= 4:
                  raise SystemExit(f"unregistered published module: {prefix}")
              if library_id != module_id - 1:
                  raise SystemExit(f"pinned title local library/module mismatch: {prefix}")
              expected_name = exact_published_names[module_id - 1].encode("ascii")
              for component in ("module", "library"):
                  if bytes.fromhex(fields[f"{prefix}.public_{component}_name_hex"]) != expected_name:
                      raise SystemExit(f"published {component} name changed for {prefix}")
          if long_form_count != 25:
              raise SystemExit(f"expected 25 independently emitted import names, got {long_form_count}")
          print("PUBLIC SYMBOL ID CROSSCHECK PASS: 25 long-form SCE records match")
          print("the separately decoded module/library local IDs and names.")
          # Demand is a STATIC reference count, not imported API execution
          # or proof that an external Sony service is implemented.
          expected_total = 40
          demand_total = int(fields["public_demand_relocation_records"])
          if demand_total != expected_total:
              raise SystemExit("pinned public title relocation demand changed")
          categories = (
              "null_symbol", "local_defined",
              "external_unclassified", "external_import",
          )
          demand_counts = {
              name: int(fields[f"public_demand_{name}_relocations"])
              for name in categories
          }
          if sum(demand_counts.values()) != expected_total:
              raise SystemExit(f"unaccounted relocation demand: {demand_counts}")
          if not 0 < demand_counts["external_import"] <= expected_total:
              raise SystemExit("the independent title has no external import demand")
          referenced_import_indices = set()
          real_import_relocations = 0
          for index in range(expected_total):
              prefix = f"relocation[{index}]"
              classification = fields[f"{prefix}.public_demand_class"]
              symbol_index = int(fields[f"{prefix}.symbol_index"])
              expected_category = {
                  "null_symbol": "null_symbol",
                  "local_defined": "local_defined",
                  "external_unclassified": "external_unclassified",
                  "public_external_import": "external_import",
              }.get(classification)
              if expected_category is None:
                  raise SystemExit(f"unknown public demand class: {classification}")
              if classification == "public_external_import":
                  real_import_relocations += 1
                  referenced_import_indices.add(symbol_index)
                  symbol_prefix = f"symbol[{symbol_index}]"
                  if fields[f"{symbol_prefix}.sce_longform"] != "1":
                      raise SystemExit("external import missing long-form symbol")
                  if fields[f"{symbol_prefix}.undefined"] != "1":
                      raise SystemExit("defined symbol counted as external")
                  for field in ("module_local_id", "library_local_id"):
                      if (fields[f"{prefix}.public_{field}"] !=
                              fields[f"{symbol_prefix}.public_{field}"]):
                          raise SystemExit(f"relocation/provider mismatch: {prefix}/{field}")
                  if (fields[f"{prefix}.public_nid_hex"] !=
                          fields[f"{symbol_prefix}.nid_hex"]):
                      raise SystemExit(f"relocation/NID mismatch: {prefix}")
              else:
                  if f"{prefix}.public_module_local_id" in fields:
                      raise SystemExit("non-import gained a public module association")
          if real_import_relocations != demand_counts["external_import"]:
              raise SystemExit("individual import references disagree with census")
          if len(referenced_import_indices) != int(
              fields["public_demand_unique_import_symbol_indices"]
          ):
              raise SystemExit("unique referenced imported symbols inconsistent")
          if not 0 < int(fields["public_demand_unique_import_identities"]) <= 25:
              raise SystemExit("invalid count of public unique import identities")
          count_groups = int(fields["public_demand_group_records"])
          if not 0 < count_groups <= expected_total:
              raise SystemExit("unbounded public demand group count")
          group_sum = 0
          for i in range(count_groups):
              prefix = f"public_demand_group[{i}]"
              mid = int(fields[f"{prefix}.module_local_id"])
              lid = int(fields[f"{prefix}.library_local_id"])
              typ = int(fields[f"{prefix}.relocation_type"])
              count = int(fields[f"{prefix}.relocation_count"])
              if not (1 <= mid <= 4 and 0 <= lid <= 3 and
                      0 <= typ < 2**32 and 0 < count <= 40):
                  raise SystemExit(f"invalid bounded import group: {prefix}")
              group_sum += count
          if group_sum != demand_counts["external_import"]:
              raise SystemExit("import groups do not cover the reference count")
          if (fields.get("public_demand_resolution") != "not_attempted" or
                  fields.get("resolution") != "not_attempted"):
              raise SystemExit("public demand misrepresented as binding success")
          print("PUBLIC RELOCATION DEMAND PASS:", demand_counts,
                "unique referenced external symbols:", len(referenced_import_indices),
                "typed demand groups:", count_groups)

          invalid = root / "bad-public-pack-title.bin"
          invalid.write_bytes(b"not-an-elf")
          refused = subprocess.run(
              [str(cli), "dependencies", "--public-sce-pack-v1", str(invalid)],
              capture_output=True, text=True, timeout=30, check=False,
          )
          if refused.returncode == 0 or "manifest_error=guest_image_failure" not in refused.stderr:
              raise SystemExit("experimental profile did not reject invalid ELF")
          if refused.stdout:
              raise SystemExit("experimental profile leaked partial manifest")
          print("PUBLIC SCE PACK V1 PASS: four independently built native-title")
          print("modules/libraries; bounded names, local IDs and versions.")
          print("TOOLCHAIN-SCOPED READ ONLY; NO RETAIL ABI PROMOTION.")
          PY

      - name: Probe independently generated clean-room PRX as a second ELF corpus
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          public = root / "ps5-native-app-boilerplate"
          cli = root / "astraea-native-title-smoke/astraea"
          builder = public / "build/host/libc-builder"
          api = public / "tooling/native/runtime/api-surface.txt"
          imports = public / "tooling/native/runtime/imports.txt"
          raw = root / "public-cleanroom-libc.raw.elf"

          # This builder and both input manifests belong to the already
          # pinned, GPL-3.0-or-later reviewed public source checkout.
          for item in (builder, api, imports):
              if not item.is_file():
                  raise SystemExit(f"pinned independent PRX build input missing: {item.name}")
          subprocess.run(
              [str(builder), str(api), str(imports), str(raw)],
              check=True, text=True, capture_output=True, timeout=90,
          )
          data = raw.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          expected = "8ee6e124993e1af26420cb455890fd002f5d6c7e78883c860ce45734e7d002bb"
          if sha != expected or len(data) != 1335962:
              raise SystemExit(f"public raw PRX identity mismatch: sha={sha}, bytes={len(data)}")
          print("INDEPENDENT CLEAN-ROOM RAW PRX VERIFIED:", sha, len(data))

          for command in ("profile", "dependencies"):
              result = subprocess.run(
                  [str(cli), command, str(raw)],
                  capture_output=True, text=True, timeout=60, check=False,
              )
              print(f"CLEANROOM_PRX_{command.upper()}_RC={result.returncode}")
              print("REPORT PREFIX:")
              print(result.stdout[:4000])
              print("ERROR PREFIX:")
              print(result.stderr[:2000])
              if result.returncode != 0 or result.stderr.strip():
                  raise SystemExit(f"verified public PRX {command} baseline regressed")
              expected_header = (
                  "Astraea retail closure profile\n" if command == "profile"
                  else "Astraea dependency manifest v0\n"
              )
              if not result.stdout.startswith(expected_header):
                  raise SystemExit(f"public PRX {command} report header changed")
              fields = {}
              for line in result.stdout.splitlines()[1:]:
                  if "=" not in line:
                      raise SystemExit(f"malformed PRX report line: {line[:100]!r}")
                  key, value = line.split("=", 1)
                  if key in fields:
                      raise SystemExit(f"duplicate PRX report field: {key}")
                  fields[key] = value
              expected_fields = (
                  {
                      "program_headers": "14",
                      "load_segments": "5",
                      "load_memory_bytes": "1294514",
                      "executable_load_segments": "1",
                      "generic_needed": "3",
                      "sce_needed_modules": "3",
                      "sce_import_libraries": "3",
                      "sce_unknown_dynamic_records": "0",
                      "dynamic_symbols": "2669",
                      "rel_relocations": "0",
                      "rela_relocations": "1796",
                      "plt_relocations": "100",
                      "total_relocations": "1896",
                      "tls_present": "1",
                      "tls_initialized_bytes": "384",
                      "tls_total_bytes": "1128",
                      "tls_alignment": "16",
                  } if command == "profile"
                  else {
                      "execution": "none",
                      "identity_policy": "opaque",
                      "generic_needed_records": "3",
                      "sce_needed_module_records": "3",
                      "sce_import_library_records": "3",
                      "dynamic_symbol_records": "2669",
                      "relocation_records": "1896",
                      "resolution": "not_attempted",
                      "relocation_application": "not_attempted",
                      "guest_instructions": "0",
                  }
              )
              for key, expected_value in expected_fields.items():
                  if fields.get(key) != expected_value:
                      raise SystemExit(
                          f"pinned raw PRX {command} {key} changed: "
                          f"{fields.get(key)!r} vs {expected_value!r}"
                      )
              if command == "dependencies":
                  (root / "public-prx-dependencies.txt").write_text(
                      result.stdout, encoding="ascii")
                  from collections import Counter

                  # These are source-generated ELF relocation records,
                  # not loader-applied patches or API calls.
                  classes = Counter()
                  referenced = set()
                  for index in range(1896):
                      prefix = f"relocation[{index}]"
                      kind = fields[f"{prefix}.table"]
                      typ = int(fields[f"{prefix}.type"])
                      si = int(fields[f"{prefix}.symbol_index"])
                      if not 0 <= si < 2669:
                          raise SystemExit(f"PRX out-of-range symbol reference: {prefix}")
                      referenced.add(si)
                      if fields[f"{prefix}.has_addend"] != "1":
                          raise SystemExit(f"PRX expected RELA signed addend: {prefix}")
                      int(fields[f"{prefix}.addend"])
                      classes[(kind, typ)] += 1
                      if kind not in ("rela", "plt_rela"):
                          raise SystemExit(f"unexpected PRX relocation table: {kind!r}")
                      if typ == 8 and si != 0:
                          raise SystemExit("RELATIVE relocation unexpectedly references symbol")
                  expected_classes = {
                      ("rela", 8): 1790,    # R_X86_64_RELATIVE, B + A
                      ("rela", 6): 3,       # R_X86_64_GLOB_DAT
                      ("rela", 16): 3,      # R_X86_64_DTPMOD64 (TLS)
                      ("plt_rela", 7): 100, # R_X86_64_JUMP_SLOT
                  }
                  if classes != Counter(expected_classes):
                      raise SystemExit(
                          f"PRX relocation class drift: observed {dict(classes)}, "
                          f"expected {expected_classes}")
                  if len(referenced) != int(
                      fields["relocation_unique_symbol_indices"]
                  ):
                      raise SystemExit("PRX relocation unique index census changed")
                  if (fields["guest_instructions"] != "0" or
                          fields["relocation_application"] != "not_attempted" or
                          fields["resolution"] != "not_attempted"):
                      raise SystemExit("PRX census misrepresented as execution")
                  print("PUBLIC RAW PRX RELOCATION CLASS CENSUS PASS:",
                        dict(classes), "unique referenced symbols:", len(referenced))
              print(f"PINNED CLEAN-ROOM PRX {command.upper()} BASELINE PASS.")


          print("PUBLIC SECOND-ARTIFACT DIAGNOSTIC PROBE COMPLETE.")
          print("Host-only raw independently generated ELF; no PS5, no gameplay.")
          PY

