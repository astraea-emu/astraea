name: C1 pinned observer build proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/c1-observer-build.yml'
      - 'tools/reference/ps5_process_entry_observer/**'

permissions:
  contents: read

jobs:
  pinned-native-title-build:
    name: Pinned observer host build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Astraea
        uses: actions/checkout@v7

      - name: Install public host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-18 lld-18 make ninja-build ccache pkg-config python3 \
            python3-venv curl wget unzip tar git

      - name: Check out the reviewed native-title reference
        env:
          PINNED_BLACKBEAR: 2f672d1c2f508e26f82ce6e27cef289a0861413c
        run: |
          git clone https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git \
            "$RUNNER_TEMP/ps5-native-app-boilerplate"
          git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" \
            checkout --detach "$PINNED_BLACKBEAR"
          test "$(git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" rev-parse HEAD)" = "$PINNED_BLACKBEAR"
          test -z "$(git -C "$RUNNER_TEMP/ps5-native-app-boilerplate" status --porcelain --untracked-files=all)"

      - name: Prepare exact observer without transport or console access
        run: |
          python3 tools/reference/ps5_process_entry_observer/prepare_blackbear_checkout.py \
            --checkout "$RUNNER_TEMP/ps5-native-app-boilerplate"
          test -s "$RUNNER_TEMP/ps5-native-app-boilerplate/.astraea-ps5-entry-observer-v0"

      - name: Build native title using the pinned public toolchain
        run: |
          make --directory="$RUNNER_TEMP/ps5-native-app-boilerplate" \
            USE_CCACHE=0 app

      - name: Verify build outputs and selected entry symbol
        run: |
          python3 - <<'PY'
          import pathlib
          import runpy
          import struct
          import os
          import hashlib

          checkout = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ps5-native-app-boilerplate'
          source = pathlib.Path('tools/reference/ps5_process_entry_observer/procparam_identity.py')
          analyzer = runpy.run_path(str(source))
          intermediate_path = checkout / 'build/llvm-pie.elf'
          final_path = checkout / 'build/eboot.elf'
          binaries = sorted((checkout / 'dist').glob('*/eboot.bin'))
          if len(binaries) != 1:
              raise SystemExit(f'expected exactly one built eboot.bin, found {len(binaries)}')
          artifacts = [intermediate_path, final_path, binaries[0]]
          for path in artifacts:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'build artifact missing or empty: {path}')

          intermediate = intermediate_path.read_bytes()
          final = final_path.read_bytes()
          find_symbol = analyzer['find_defined_symbol']
          observer_entry = find_symbol(intermediate, '_start', 'intermediate ELF')
          crt_entry = find_symbol(intermediate, 'astraea_reference_crt_start', 'intermediate ELF')
          capture = find_symbol(intermediate, 'astraea_ps5_entry_capture_v0', 'intermediate ELF')
          initial_entry = struct.unpack_from('<Q', intermediate, 0x18)[0]
          final_entry = struct.unpack_from('<Q', final, 0x18)[0]
          if observer_entry != initial_entry or observer_entry == crt_entry:
              raise SystemExit('observer is not the selected intermediate ELF entry or aliases CRT')
          if final_entry != observer_entry:
              raise SystemExit('converted PS5 ELF entry does not preserve the observer entry')
          procparam, _ = analyzer['find_procparam'](final, 'final ELF')
          loads = analyzer['mapped_loads'](final, 'final ELF')
          analyzer['require_unique_mapped_address'](loads, final_entry, 'converted observer entry')
          analyzer['require_unique_mapped_address'](loads, capture, 'observer capture')
          analyzer['require_unique_mapped_address'](loads, procparam.vaddr, 'procparam')

          print(f'verified observer entry 0x{observer_entry:x}; CRT 0x{crt_entry:x}; '
                f'capture 0x{capture:x}; procparam 0x{procparam.vaddr:x}')
          for path in artifacts:
              print(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(checkout)}')
          print('HOST BUILD ONLY; no hardware execution or C1 ABI promotion')
          PY

      - name: Exercise real-ELF offline analysis with labelled synthetic logs
        run: |
          python3 tools/reference/ps5_process_entry_observer/offline_pipeline_smoke.py \
            --intermediate "$RUNNER_TEMP/ps5-native-app-boilerplate/build/llvm-pie.elf" \
            --final "$RUNNER_TEMP/ps5-native-app-boilerplate/build/eboot.elf"

      - name: Build Astraea's production read-only diagnostics
        run: |
          cmake -S . -B "$RUNNER_TEMP/astraea-native-title-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DASTRAEA_WARNINGS_AS_ERRORS=ON
          cmake --build "$RUNNER_TEMP/astraea-native-title-smoke" \
            --target astraea --parallel 3

      - name: Probe public independent PS5-format title with Astraea
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import os

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          astr = root / "astraea-native-title-smoke/astraea"
          homebrew = root / "ps5-native-app-boilerplate"
          assert astr.is_file() and astr.stat().st_size > 0
          target = homebrew / "build/eboot.elf"
          assert target.is_file() and target.stat().st_size > 0
          def run_and_report(command):
              result = subprocess.run(
                  [str(astr), command, str(target)],
                  capture_output=True,
                  text=True,
                  timeout=30,
                  check=False,
              )
              print(f"ASTRAEA_{command.upper()}_RC={result.returncode}")
              print(result.stdout[:6000])
              print(result.stderr[:6000])
              if result.returncode != 0:
                  raise SystemExit(f"{command} did not return its typed success report")
              if result.stderr.strip():
                  raise SystemExit(f"{command} unexpectedly emitted stderr")
              fields = {}
              for line in result.stdout.splitlines()[1:]:
                  if "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  if key in fields:
                      raise SystemExit(f"{command} repeated output field {key}")
                  fields[key] = value
              return fields

          profile = run_and_report("profile")
          for key, expected in {
              "program_headers": "14",
              "load_segments": "5",
              "sce_needed_modules": "4",
              "sce_import_libraries": "4",
              "total_relocations": "40",
              "tls_present": "1",
          }.items():
              if profile.get(key) != expected:
                  raise SystemExit(
                      f"pinned public ELF {key}: expected {expected}, "
                      f"observed {profile.get(key)}"
                  )

          diagnosis = run_and_report("diagnose")
          for key, expected in {
              "boundary": "unsupported_dynamic_dependencies",
              "stage": "pre_entry",
              "guest_rip": "0x10",
              "detail0": "12",
          }.items():
              if diagnosis.get(key) != expected:
                  raise SystemExit(
                      f"pinned public ELF {key}: expected {expected}, "
                      f"observed {diagnosis.get(key)}"
                  )
          print("REAL CLEAN-ROOM ELF PROFILE/DIAGNOSTIC REGRESSION PASS.")
          print("NO GUEST INSTRUCTIONS EXECUTED; NO PS5 HARDWARE OBSERVATION.")
          PY

      - name: Exercise bounded read-only dependency manifest on public native title
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          astr = root / "astraea-native-title-smoke/astraea"
          title = root / "ps5-native-app-boilerplate/build/eboot.elf"
          result = subprocess.run(
              [str(astr), "dependencies", str(title)],
              text=True, capture_output=True, timeout=30, check=False,
          )
          print(result.stdout[:8000])
          print(result.stderr[:1000])
          if result.returncode != 0 or result.stderr.strip():
              raise SystemExit("read-only dependency manifest did not succeed")
          if any(ord(c) < 32 and c != "\n" for c in result.stdout):
              raise SystemExit("manifest contains unescaped control characters")
          lines = result.stdout.splitlines()
          if lines[0] != "Astraea dependency manifest v0":
              raise SystemExit("wrong manifest header")
          fields = {}
          for line in lines[1:]:
              if "=" not in line:
                  raise SystemExit(f"unstructured manifest line: {line!r}")
              key, value = line.split("=", 1)
              if key in fields:
                  raise SystemExit(f"duplicate manifest field: {key}")
              fields[key] = value
          expected = {
              "execution": "none",
              "identity_policy": "opaque",
              "generic_needed_records": "4",
              "sce_needed_module_records": "4",
              "sce_import_library_records": "4",
              "resolution": "not_attempted",
              "guest_instructions": "0",
          }
          for key, value in expected.items():
              if fields.get(key) != value:
                  raise SystemExit(f"manifest {key}: {fields.get(key)!r}, expected {value!r}")
          for i in range(4):
              for category in ("sce_needed_module", "sce_import_library"):
                  prefix = f"{category}[{i}]"
                  assert re.fullmatch(r"0x[0-9a-f]+", fields[f"{prefix}.raw_value"])
                  assert fields[f"{prefix}.duplicate_raw"] in ("0", "1")
              prefix = f"generic_needed[{i}]"
              raw_name = fields[f"{prefix}.name_hex"]
              assert re.fullmatch(r"(?:[0-9a-f]{2})+", raw_name)
              assert len(bytes.fromhex(raw_name)) <= 256
              assert fields[f"{prefix}.duplicate"] in ("0", "1")
          for field in ("generic_needed_unique_names", "sce_needed_module_unique_raw",
                        "sce_import_library_unique_raw"):
              value = int(fields[field])
              if not 1 <= value <= 4:
                  raise SystemExit(f"invalid unique count: {field}={value}")
          if fields.get("dynamic_symbol_records") != "26":
              raise SystemExit("public independent title symbol census changed")
          named = 0
          undefined = 0
          longform = 0
          for i in range(26):
              prefix = f"symbol[{i}]"
              raw_name = fields[f"{prefix}.name_hex"]
              if raw_name:
                  if not re.fullmatch(r"(?:[0-9a-f]{2})+", raw_name):
                      raise SystemExit(f"nonhex symbol name: {prefix}")
                  named += 1
              if fields[f"{prefix}.undefined"] == "1":
                  undefined += 1
              elif fields[f"{prefix}.undefined"] != "0":
                  raise SystemExit(f"invalid undefined field: {prefix}")
              if fields[f"{prefix}.sce_longform"] == "1":
                  longform += 1
                  for item in ("nid_hex", "library_id_hex", "module_id_hex"):
                      if not re.fullmatch(
                          r"(?:[0-9a-f]{2})+",
                          fields[f"{prefix}.{item}"],
                      ):
                          raise SystemExit(f"malformed identity bytes: {prefix}/{item}")
              elif fields[f"{prefix}.sce_longform"] != "0":
                  raise SystemExit(f"invalid identity classification: {prefix}")
              for item in ("binding", "type"):
                  if not 0 <= int(fields[f"{prefix}.{item}"]) <= 15:
                      raise SystemExit(f"invalid ELF symbol field: {prefix}/{item}")
          if not (named > 0 and undefined > 0 and longform > 0):
              raise SystemExit("expected public title to exercise named imports and SCE identities")
          if int(fields["dynamic_symbol_unique_nonempty_names"]) > named:
              raise SystemExit("impossible unique symbol count")
          print(f"SYMBOL CENSUS PASS: 26 records, {named} named, "
                f"{undefined} undefined, {longform} long-form SCE identities.")
          malformed = root / "astraea-invalid-dependency-input.bin"
          malformed.write_bytes(b"not-an-elf")
          rejected = subprocess.run(
              [str(astr), "dependencies", str(malformed)],
              text=True, capture_output=True, timeout=30, check=False,
          )
          if rejected.returncode == 0 or "manifest_error=guest_image_failure" not in rejected.stderr:
              raise SystemExit("malformed ELF input was not explicitly refused")
          if rejected.stdout:
              raise SystemExit("malformed input emitted a misleading partial manifest")
          print("DEPENDENCY MANIFEST PASS: real clean-room title, lossless escaped names,")
          print("raw SCE identities, bounded counts, and fail-closed malformed input.")
          print("NO ABI PROMOTION; NO GUEST EXECUTION.")
          PY
