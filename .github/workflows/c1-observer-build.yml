            --provider-manifest "$RUNNER_TEMP/public-prx-dependencies.txt" \
            --title-elf "$RUNNER_TEMP/ps5-native-app-boilerplate/build/eboot.elf" \
            --provider-elf "$RUNNER_TEMP/public-cleanroom-libc.raw.elf" \
            --report "$RUNNER_TEMP/public-two-elf-lexical-closure.json"
          test -s "$RUNNER_TEMP/public-two-elf-lexical-closure.json"
          echo "HOST-ONLY TWO-ARTIFACT DEMAND REPORT PASS; NO GUEST EXECUTION OR BINDING."
